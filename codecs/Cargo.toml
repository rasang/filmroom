[package]
name = "film-photo-codecs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
[lib]
name = "film_codecs"
crate-type = ["rlib", "cdylib"]
[dependencies]
arw6-bounded-prototype = { path = "arw6-bounded" }
rawler = "=0.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21.1"
libc = "0.2"
rayon = "1.10"
moxcms = "=0.8.1"
jpeg-encoder = "=0.7.1"
tiff = { version = "=0.11.3", default-features = false }
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
[profile.dev]
debug = 0

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }

# Entropy and wavelet coefficients are untrusted. Keep arithmetic failure
# deterministic in release; the RAW boundary catches it and deletes partials.
# Codec-defined wrapping remains explicit through wrapping_* operations.
[profile.release.package.rawler]
overflow-checks = true
