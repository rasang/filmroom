name: Mimo format interoperability audit
on:
  push:
    branches: [livephoto-sdk]
    paths: ['.github/workflows/mimo-format-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download official APK and inspect manifest and DEX inventory
        shell: bash
        run: |
          mkdir -p evidence tools
          python3 - <<'PY' | tee evidence/inventory.txt
          import urllib.request, urllib.parse, re, json, html, hashlib, pathlib, zipfile, struct, subprocess, os, glob
          page='https://service-adhoc.dji.com/download/app/android/9bce0a64-3069-40c7-9bbf-1263da0bb900'
          headers={'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/130.0 Mobile Safari/537.36'}
          def download(url,path,limit):
              req=urllib.request.Request(url,headers=headers)
              digest=hashlib.sha256();total=0
              with urllib.request.urlopen(req,timeout=90) as source,open(path,'wb') as out:
                  while True:
                      chunk=source.read(1024*1024)
                      if not chunk:break
                      total+=len(chunk)
                      if total>limit:raise RuntimeError('Download exceeds safety cap')
                      out.write(chunk);digest.update(chunk)
              return {'bytes':total,'sha256':digest.hexdigest()}
          with urllib.request.urlopen(urllib.request.Request(page,headers=headers),timeout=40) as response:
              text=response.read(300000).decode('utf-8')
          links=[html.unescape(x) for x in re.findall(r'href="([^"]+)"',text) if '.apk' in x]
          if not links:raise RuntimeError('No official APK link')
          url=links[0]
          host=urllib.parse.urlparse(url).hostname
          assert host and host.endswith('.djicdn.com') and 'Mimo' in url
          info={'official_landing_page':page,'apk_url_without_temporary_query':url.split('?')[0]}
          print('DOWNLOADING',info['apk_url_without_temporary_query'],flush=True)
          info.update(download(url,'mimo.apk',2300*1024*1024))
          print('APK_IDENTITY',json.dumps(info),flush=True)
          pathlib.Path('evidence/identity.json').write_text(json.dumps(info,indent=2))
          for tool,params in [('aapt',['dump','badging']),('apksigner',['verify','--print-certs'])]:
              matches=glob.glob(os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')+'/build-tools/*/'+tool)
              if matches:
                  result=subprocess.run([sorted(matches)[-1],*params,'mimo.apk'],capture_output=True,text=True,timeout=60)
                  pathlib.Path('evidence/'+tool+'.txt').write_text(result.stdout+'\n'+result.stderr)
                  print(tool,result.returncode,'\n','\n'.join(result.stdout.splitlines()[:30]),flush=True)
          def u32(b,p):return struct.unpack_from('<I',b,p)[0]
          def leb(b,p):
              n=0;shift=0
              for i in range(5):
                  c=b[p];p+=1;n|=(c&127)<<shift
                  if c<128:return n,p
                  shift+=7
              raise ValueError('LEB overflow')
          key=re.compile(r'live.?photo|motion.?photo|moving.?photo|vivoMedia|LiveMedia',re.I)
          class_rows=[]
          with zipfile.ZipFile('mimo.apk') as z:
              members=z.infolist()
              print('APK_ENTRIES',len(members),flush=True)
              print('INTERESTING_ASSETS',json.dumps([m.filename for m in members if key.search(m.filename) or 'secneo' in m.filename.lower() or 'dexhelper' in m.filename.lower()]),flush=True)
              for m in members:
                  if re.fullmatch(r'classes\d*\.dex',m.filename):
                      b=z.read(m)
                      if not b.startswith(b'dex\n'): print('NONSTANDARD_DEX',m.filename,b[:16].hex());continue
                      sn,so=u32(b,56),u32(b,60);tn,to=u32(b,64),u32(b,68);cn,co=u32(b,96),u32(b,100)
                      strings=[]
                      for i in range(sn):
                          p=u32(b,so+i*4);_,p=leb(b,p);end=b.index(b'\0',p)
                          strings.append(b[p:end].decode('utf-8','replace'))
                      types=[strings[u32(b,to+i*4)] for i in range(tn)]
                      classes=[types[u32(b,co+i*32)] for i in range(cn)]
                      hits=[s for s in strings if key.search(s)]
                      print('\nDEX',m.filename,'BYTES',len(b),'CLASSES',cn,'MATCHING_STRINGS',len(hits),flush=True)
                      for s in hits[:450]:print('STR',s[:1000],flush=True)
                      for c in classes:
                          if key.search(c):class_rows.append({'dex':m.filename,'class':c})
                  elif m.filename.startswith('lib/arm64-v8a/') and m.filename.endswith('.so'):
                      b=z.read(m)
                      hits=[]
                      for match in re.finditer(rb'[\x20-\x7e]{8,}',b):
                          s=match.group().decode('ascii')
                          if key.search(s):hits.append(s[:700])
                      if hits:
                          print('\nNATIVE',m.filename,'HITS',len(hits),flush=True)
                          for s in hits[:100]:print('NATIVE_STR',s,flush=True)
          pathlib.Path('evidence/classes.json').write_text(json.dumps(class_rows,indent=2))
          print('MATCHING_CLASS_DEFINITIONS',json.dumps(class_rows),flush=True)
          jadx=download('https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip','tools/jadx.zip',160*1024*1024)
          assert jadx['sha256']=='8280f3799c0273fe797a2bcd90258c943e451fd195f13d05400de5e6451d15ec'
          with zipfile.ZipFile('tools/jadx.zip') as z:z.extractall('tools/jadx')
          print('JADX_IDENTITY',json.dumps(jadx),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mimo-audit-inventory
          path: evidence/
          retention-days: 1
      - name: Decompile only Live Photo related classes for interoperability inspection
        shell: bash
        run: |
          cat > tools/Audit.java <<'JAVA'
          import jadx.api.*;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;
          import java.util.regex.*;
          public class Audit {
            public static void main(String[] args) throws Exception {
              JadxArgs config=new JadxArgs();
              config.setInputFiles(List.of(new File("mimo.apk")));
              config.setSkipResources(true);
              config.setThreadsCount(2);
              try(JadxDecompiler d=new JadxDecompiler(config)) {
                d.load();
                Pattern p=Pattern.compile("live.?photo|motion.?photo|moving.?photo|vivomedia|livemedia",Pattern.CASE_INSENSITIVE);
                int count=0;
                Path dest=Path.of("inspection");Files.createDirectories(dest);
                for(JavaClass c:d.getClasses()) {
                  String name=c.getFullName();
                  if(!p.matcher(name).find() || name.contains("databinding") || name.endsWith("Binding"))continue;
                  System.out.println("TARGET_CLASS "+name);
                  if(++count>130) {System.out.println("CLASS_CAP_REACHED");break;}
                  try {
                    String code=c.getCode();
                    Files.writeString(dest.resolve(name.replace('.','_')+".txt"),code);
                    String[] lines=code.split("\\R");
                    System.out.println("CLASS_SUMMARY "+name+" lines="+lines.length);
                    Pattern interesting=Pattern.compile("support|capab|manufacturer|brand|version|feature|systempropert|content://|livephoto|motionphoto|movingphoto|oplus|vivo|xiaomi|samsung|honor",Pattern.CASE_INSENSITIVE);
                    BitSet keep=new BitSet();
                    for(int i=0;i<lines.length;i++)if(interesting.matcher(lines[i]).find()) keep.set(Math.max(0,i-4),Math.min(lines.length,i+9));
                    int written=0;
                    for(int i=keep.nextSetBit(0);i>=0;i=keep.nextSetBit(i+1)) {
                      if(++written>450){System.out.println("EXCERPT_CAP_REACHED");break;}
                      System.out.println((i+1)+": "+lines[i]);
                    }
                  }catch(Throwable e){System.out.println("CLASS_ERROR "+name+" "+e);}
                }
                System.out.println("DECOMPILED_TARGET_COUNT "+count);
              }
            }
          }
          JAVA
          javac -cp 'tools/jadx/lib/*' tools/Audit.java
          timeout 600 java -Xmx6g -cp 'tools/jadx/lib/*:tools' Audit > evidence/selected-analysis.txt 2>&1
          tail -30 evidence/selected-analysis.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mimo-audit-analysis
          path: evidence/
          retention-days: 1
