name: Finishing performance branch checks
on:
  push:
    branches: [feat/finishing-preview-export-perf]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finishing-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible host compiler for offline validation
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          TOOLCHAIN=$(rustc +1.88.0 --print sysroot)
          tar --exclude='./share/doc' --exclude='./share/man' -czf "$RUNNER_TEMP/rust-toolchain.tar.gz" -C "$TOOLCHAIN" .
      - uses: actions/upload-artifact@v4
        with:
          name: rust-1.88.0-host-validation
          path: ${{ runner.temp }}/rust-toolchain.tar.gz
          retention-days: 1
