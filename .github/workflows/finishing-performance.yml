name: Finishing performance branch checks
on:
  push:
    branches: [feat/finishing-preview-export-perf]
    paths: ['app/**', 'native/**', 'codecs/**', 'docs/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finishing-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal && rustup override set 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          key: finishing-contracts
      - name: Finishing, cache invalidation and bounded reuse contracts
        working-directory: native
        run: |
          cargo test --locked -p film-engine --features precision-f64 --lib finishing -- --test-threads=1
          cargo test --locked -p film-engine --features precision-f64 --lib preview_brightness_cache_tests -- --test-threads=1
          cargo test --locked -p film-engine --features precision-f64 --lib preview_stage_cache -- --test-threads=1
          cargo test --locked -p spektrafilm-core --features precision-f64 --lib preview_film_log_contract_tests -- --test-threads=1
          cargo test --locked -p spektrafilm-gpu --features precision-f64 --lib resident_reuse -- --test-threads=1
          cargo check --locked -p film-engine --features precision-f64,adreno-gpu
      - name: Install software Vulkan for mandatory real dispatch tests
        run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Real Vulkan post-grain split and pooled output parity
        working-directory: native
        env:
          FILMROOM_REQUIRE_GPU_SMOKE: '1'
          XDG_RUNTIME_DIR: /tmp
        run: cargo test --locked -p spektrafilm-core --features precision-f64,wgpu-backend --test gpu_reprint -- --test-threads=1 --nocapture
  codec-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal && rustup override set 1.88.0
      - name: Build pinned JPEG XL host dependency
        run: echo "FILM_JXL_PREFIX=$(bash third-party/libjxl/build.sh host)" >> "$GITHUB_ENV"
      - name: Codec tests including exact quantization boundaries
        working-directory: codecs
        run: cargo test --locked --lib -- --test-threads=1
  android-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile Android sources and verify legacy recipes and finishing ABI
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -x :app:verifyEffectAudioAssets --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --tests dev.filmroom.FinishingStateHostTest --tests dev.filmroom.presets.SavedPresetCoverageHostTest --tests dev.filmroom.presets.PresetQrCodecHostTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finishing-android-unit-reports
          path: app/build/reports/tests/
          retention-days: 3
