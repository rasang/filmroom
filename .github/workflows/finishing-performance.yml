name: Finishing performance branch checks
on:
  push:
    branches: [feat/finishing-preview-export-perf]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finishing-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Complete locked dependency sources for offline host validation
        run: |
          cargo vendor --locked --manifest-path native/Cargo.toml "$RUNNER_TEMP/native-vendor" > "$RUNNER_TEMP/vendor-config.toml"
          tar -czf "$RUNNER_TEMP/native-vendor.tar.gz" -C "$RUNNER_TEMP/native-vendor" .
      - uses: actions/upload-artifact@v4
        with:
          name: native-locked-host-dependencies
          path: ${{ runner.temp }}/native-vendor.tar.gz
          retention-days: 1
