name: Apply and verify finishing review fixes
on:
  push:
    branches: [feat/finishing-preview-export-perf]
    paths: [.github/workflows/finishing-review-fix.yml]
permissions:
  contents: read
concurrency:
  group: finishing-review-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/finishing-preview-export-perf'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply only hash-verified review changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/finishing-preview-export-perf
          python3 .github/review-fix/apply.py
          git diff --check
      - name: Commit fixes and remove temporary write workflow
        id: commit
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git rm .github/review-fix/apply.py .github/workflows/finishing-review-fix.yml
          git add .github/workflows/finishing-performance.yml \
            app/src/main/java/dev/filmroom/lifecycle/PrivateWorkRecovery.kt \
            app/src/main/java/dev/filmroom/engine/ExportPlanning.kt \
            app/src/main/java/dev/filmroom/engine/FilmEngine.kt \
            app/src/main/java/dev/filmroom/export/ExportQueue.kt \
            app/src/main/java/dev/filmroom/export/ScanPreviewStore.kt \
            app/src/main/java/dev/filmroom/export/ScanPreviewPublicationGate.kt \
            app/src/test/java/dev/filmroom/lifecycle/FinishingRecoveryHostTest.kt \
            app/src/test/java/dev/filmroom/export/ScanPreviewStoreHostTest.kt \
            native/crates/film-engine/src/mobile.rs \
            native/crates/film-engine/src/scan_preview.rs \
            docs/FINISHING_REVIEW_FIXES.md
          git diff --cached --check
          git config user.name 'Filmroom branch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reclaim interrupted finishing spools and publish final graded previews'
          git push origin HEAD:refs/heads/feat/finishing-preview-export-perf
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  android-review:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android and run preview, recovery and recipe regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -x :app:verifyEffectAudioAssets --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --tests dev.filmroom.FinishingStateHostTest --tests dev.filmroom.lifecycle.FinishingRecoveryHostTest --tests dev.filmroom.export.ScanPreviewStoreHostTest --tests dev.filmroom.presets.SavedPresetCoverageHostTest --tests dev.filmroom.presets.PresetQrCodecHostTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finishing-review-android-tests
          path: app/build/test-results/
          retention-days: 3
  native-review:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal && rustup override set 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          key: finishing-contracts
      - name: Native finishing and scan-preview regression tests
        working-directory: native
        run: |
          cargo test --locked -p film-engine --features precision-f64 --lib finishing -- --test-threads=1
          cargo test --locked -p film-engine --features precision-f64 --lib scan_preview::tests -- --test-threads=1
          cargo check --locked -p film-engine --features precision-f64,adreno-gpu
