name: Publish Filmroom Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.22.2)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish Signed GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify version and locate signed APK build
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python3 - "$VERSION" << 'PYEOF'
          import pathlib, re, sys
          version = sys.argv[1]
          gradle = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          m_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          m_code = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          assert m_name and m_code, "Could not parse versionName/versionCode in app/build.gradle.kts"
          assert m_name.group(1) == version, f"Tag version {version} != Gradle versionName {m_name.group(1)}"
          print(f"Verified versionName={version} versionCode={m_code.group(1)}")
          PYEOF

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/runs?per_page=25" > /tmp/runs.json

          RUN_INFO=$(python3 - << 'PYEOF'
          import json, pathlib, subprocess, sys

          data = json.loads(pathlib.Path("/tmp/runs.json").read_text(encoding="utf-8"))
          runs = data.get("workflow_runs", [])
          build_paths = [
              "app", "native", "codecs", "third-party", "tools",
              "build.gradle.kts", "settings.gradle.kts", "gradle", "gradle.properties", "gradlew"
          ]

          def matches_tree(sha: str) -> bool:
              r1 = subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"])
              if r1.returncode != 0:
                  return False
              r2 = subprocess.run(["git", "diff", "--quiet", sha, "HEAD", "--", *build_paths])
              return r2.returncode == 0

          for r in runs:
              if r.get("status") == "completed" and r.get("conclusion") == "success" and matches_tree(r["head_sha"]):
                  print(f"{r['id']} {r['head_sha']} completed")
                  sys.exit(0)

          for r in runs:
              if r.get("status") in ("queued", "in_progress", "waiting", "pending", "requested") and matches_tree(r["head_sha"]):
                  print(f"{r['id']} {r['head_sha']} in_progress")
                  sys.exit(0)

          sys.exit(1)
          PYEOF
          )

          RUN_ID=$(echo "$RUN_INFO" | awk '{print $1}')
          BUILD_SHA=$(echo "$RUN_INFO" | awk '{print $2}')
          RUN_STATE=$(echo "$RUN_INFO" | awk '{print $3}')
          echo "Matched Build Filmroom APK run=$RUN_ID sha=$BUILD_SHA state=$RUN_STATE"

          if [ "$RUN_STATE" != "completed" ]; then
            gh run watch "$RUN_ID" -R "$GITHUB_REPOSITORY" --exit-status
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"

      - name: Download, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.locate.outputs.tag }}
          VERSION: ${{ steps.locate.outputs.version }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          BUILD_SHA: ${{ steps.locate.outputs.build_sha }}
        run: |
          mkdir -p /tmp/apk-dl
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n filmroom-arm64-signed-apk -D /tmp/apk-dl
          APK_NAME="Filmroom-${VERSION}-arm64-v8a.apk"
          cp "/tmp/apk-dl/filmroom-arm64-signed.apk" "$APK_NAME"

          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_NAME" | grep -qi "1cf7b23f5c954a781ef1260634fb8b4df3e84a59bae486dc5b357bd5fabaf37a"
          fi
          python3 tools/effect-audio/verify-package.py "$APK_NAME"
          unzip -t "$APK_NAME" >/dev/null

          sha256sum "$APK_NAME" > SHA256SUMS
          APK_SHA256=$(awk '{print $1}' SHA256SUMS)
          TAG_SHA=$(git rev-parse HEAD)
          NOTES_FILE="/tmp/release-notes.md"

          python3 - "$VERSION" "$APK_NAME" "$APK_SHA256" "$TAG_SHA" "$BUILD_SHA" "$NOTES_FILE" << 'PYEOF'
          import os, pathlib, sys
          version, apk_name, sha256, tag_sha, build_sha, notes_out = sys.argv[1:]
          size_str = f"{os.path.getsize(apk_name):,}"
          doc = pathlib.Path(f"docs/releases/{version}.md")
          base = doc.read_text(encoding="utf-8").rstrip() if doc.is_file() else f"Filmroom {version} (arm64-v8a)"
          commit_line = f"main/dev 提交：{tag_sha}" if tag_sha == build_sha else f"main/dev 提交：{tag_sha}（APK 构建提交：{build_sha}）"
          footer = (
              "\n\n## 下载核验\n"
              f"{commit_line}\n"
              f"APK：{apk_name}（{size_str} bytes）\n"
              f"SHA-256：{sha256}\n"
              "原发行签名、三条未压缩音轨哈希、ZIP 完整性与 16KiB 对齐已核验。\n"
          )
          pathlib.Path(notes_out).write_text(base + footer, encoding="utf-8")
          PYEOF

          if [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" "$APK_NAME" SHA256SUMS --title "Filmroom ${VERSION}" --notes-file "$NOTES_FILE" --prerelease -R "$GITHUB_REPOSITORY" || {
              gh release upload "$TAG" "$APK_NAME" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
              gh release edit "$TAG" --title "Filmroom ${VERSION}" --notes-file "$NOTES_FILE" --prerelease=true -R "$GITHUB_REPOSITORY"
            }
          else
            gh release create "$TAG" "$APK_NAME" SHA256SUMS --title "Filmroom ${VERSION}" --notes-file "$NOTES_FILE" -R "$GITHUB_REPOSITORY" || {
              gh release upload "$TAG" "$APK_NAME" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
              gh release edit "$TAG" --title "Filmroom ${VERSION}" --notes-file "$NOTES_FILE" --prerelease=false -R "$GITHUB_REPOSITORY"
            }
          fi
