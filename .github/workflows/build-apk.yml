name: Build Filmroom APK

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Install CMake and Ninja (for libjxl)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 35 & NDK 27.2.12479018
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Rust toolchains (1.88.0 & 1.94.0)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock', 'codecs/Cargo.lock') }}

      - name: Build native engine (libfilm_engine.so, Rust 1.88.0)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: |
          bash native/build-native.sh --check
          bash native/build-native.sh all

      - name: Build codecs & libjxl (libfilm_codecs.so, Rust 1.94.0)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          RUSTUP_TOOLCHAIN: "1.94.0"
        run: bash codecs/build-android.sh

      - name: Copy JNI libraries into app/src/main/jniLibs
        run: |
          for abi in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "native/artifacts/jniLibs/$abi/libfilm_engine.so" "app/src/main/jniLibs/$abi/"
            cp "codecs/artifacts/jniLibs/$abi/libfilm_codecs.so" "app/src/main/jniLibs/$abi/"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: filmroom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
