name: Build Filmroom APK

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Repacked APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Install CMake, Ninja and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ffmpeg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 35 & NDK 27.2.12479018
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchains (1.88.0 & 1.94.0)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock', 'codecs/Cargo.lock') }}

      - name: Build native engine (arm64-v8a, Rust 1.88.0)
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: |
          bash native/build-native.sh --check
          bash native/build-native.sh arm64-v8a

      - name: Build codecs & libjxl (Rust 1.94.0)
        env:
          RUSTUP_TOOLCHAIN: "1.94.0"
        run: bash codecs/build-android.sh

      - name: Copy ARM64 JNI libraries into app/src/main/jniLibs
        run: |
          mkdir -p "app/src/main/jniLibs/arm64-v8a"
          cp "native/artifacts/jniLibs/arm64-v8a/libfilm_engine.so" "app/src/main/jniLibs/arm64-v8a/"
          cp "codecs/artifacts/jniLibs/arm64-v8a/libfilm_codecs.so" "app/src/main/jniLibs/arm64-v8a/"

      - name: Generate synthetic effect audio for CI APK
        run: |
          python3 tools/effect-audio/generate.py
          (cd app/src/main/assets/effect_audio && sha256sum light_table.m4a optical_leak.m4a optical_leak_slow.m4a > SHA256SUMS)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ARM64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PfilmroomAbi=arm64-v8a --no-daemon --max-workers=2

      - name: Repack, 16KiB zipalign and sign APK
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          echo "Original APK size:" && ls -lh "$RAW_APK"

          python3 tools/repack-apk-transport.py "$RAW_APK" build-repacked.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 build-repacked.apk build-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-temp.jks \
            -storepass android -keypass android \
            -alias ci-key -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Filmroom CI, OU=Dev, O=Filmroom, L=Unknown, ST=Unknown, C=CN"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/ci-temp.jks \
            --ks-pass pass:android \
            --ks-key-alias ci-key \
            --key-pass pass:android \
            --v1-signing-enabled false \
            --out filmroom-arm64-ci.apk \
            build-aligned.apk

          python3 tools/effect-audio/verify-package.py filmroom-arm64-ci.apk
          echo "Final repacked APK size:" && ls -lh filmroom-arm64-ci.apk
          rm -f /tmp/ci-temp.jks build-repacked.apk build-aligned.apk

      - name: Upload Repacked ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: filmroom-arm64-repacked-apk
          path: filmroom-arm64-ci.apk
          retention-days: 14
