name: Build Filmroom APK

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake, Ninja and Cryptography
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-cryptography

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 35 & NDK 27.2.12479018
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchains (1.88.0 & 1.94.0)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock', 'codecs/Cargo.lock') }}

      - name: Build native engine (arm64-v8a, Rust 1.88.0)
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: |
          bash native/build-native.sh --check
          bash native/build-native.sh arm64-v8a

      - name: Build codecs & libjxl (arm64-v8a, Rust 1.94.0)
        env:
          RUSTUP_TOOLCHAIN: "1.94.0"
        run: bash codecs/build-android.sh arm64-v8a

      - name: Copy ARM64 JNI libraries into app/src/main/jniLibs
        run: |
          mkdir -p "app/src/main/jniLibs/arm64-v8a"
          cp "native/artifacts/jniLibs/arm64-v8a/libfilm_engine.so" "app/src/main/jniLibs/arm64-v8a/"
          cp "codecs/artifacts/jniLibs/arm64-v8a/libfilm_codecs.so" "app/src/main/jniLibs/arm64-v8a/"

      - name: Restore verified effect audio from release APK
        run: |
          curl -fsSL -o /tmp/ref-release.apk "https://github.com/rasang/filmroom/releases/download/v0.1.22.2-beta13/Filmroom-0.1.22.2-beta13-arm64-v8a.apk"
          python3 tools/effect-audio/verify-package.py /tmp/ref-release.apk
          python3 - << 'PYEOF'
          import pathlib, zipfile
          dest = pathlib.Path("app/src/main/assets/effect_audio")
          with zipfile.ZipFile("/tmp/ref-release.apk") as zf:
              for name in ("light_table.m4a", "optical_leak.m4a", "optical_leak_slow.m4a"):
                  (dest / name).write_bytes(zf.read("assets/effect_audio/" + name))
          PYEOF
          rm -f /tmp/ref-release.apk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ARM64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PfilmroomAbi=arm64-v8a --no-daemon --max-workers=2

      - name: Repack, 16KiB zipalign and sign with release key
        env:
          FILMROOM_SIGNING_ENC_B64: ${{ secrets.FILMROOM_SIGNING_ENC_B64 }}
          FILMROOM_SIGNING_RECOVERY_KEY: ${{ secrets.FILMROOM_SIGNING_RECOVERY_KEY }}
        run: |
          SIGN_DIR=$(mktemp -d)
          chmod 700 "$SIGN_DIR"
          trap 'rm -rf "$SIGN_DIR" build-repacked.apk build-aligned.apk' EXIT

          python3 - "$SIGN_DIR" << 'PYEOF'
          import base64, io, os, sys, tarfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          out_dir = Path(sys.argv[1])
          enc = base64.b64decode(os.environ["FILMROOM_SIGNING_ENC_B64"].strip())
          key = base64.b64decode(os.environ["FILMROOM_SIGNING_RECOVERY_KEY"].strip())
          aad = b"FILMROOM-SIGNING-BACKUP-V1\n"
          assert enc.startswith(aad), "Unexpected encrypted backup header"
          nonce = enc[len(aad):len(aad) + 12]
          ciphertext = enc[len(aad) + 12:]
          tar_bytes = AESGCM(key).decrypt(nonce, ciphertext, aad)

          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:*") as tf:
              for member_name in ("filmroom-release.p12", "keystore-password.txt"):
                  data = tf.extractfile(member_name).read()
                  (out_dir / member_name).write_bytes(data)
                  os.chmod(out_dir / member_name, 0o600)
          PYEOF

          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          python3 tools/repack-apk-transport.py "$RAW_APK" build-repacked.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 build-repacked.apk build-aligned.apk

          export KS_PASS=$(tr -d '\r\n' < "$SIGN_DIR/keystore-password.txt")
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$SIGN_DIR/filmroom-release.p12" \
            --ks-type PKCS12 \
            --ks-pass env:KS_PASS \
            --ks-key-alias filmroom-release \
            --key-pass env:KS_PASS \
            --v1-signing-enabled false \
            --out filmroom-arm64-signed.apk \
            build-aligned.apk
          unset KS_PASS

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs filmroom-arm64-signed.apk | grep -qi "1cf7b23f5c954a781ef1260634fb8b4df3e84a59bae486dc5b357bd5fabaf37a"
          python3 tools/effect-audio/verify-package.py filmroom-arm64-signed.apk
          ls -lh filmroom-arm64-signed.apk

      - name: Upload Signed ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: filmroom-arm64-signed-apk
          path: filmroom-arm64-signed.apk
          retention-days: 14
